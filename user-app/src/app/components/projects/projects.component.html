<section id="projects" class="projects noise">
  <app-section-title label="PROYECTOS" num="07" />

  <!-- Filters -->
  <div class="proj-filters">
    @for (f of filters; track f) {
      <button
        class="filter-btn"
        [class.active]="filter === f"
        (click)="filter = f">
        {{ f }}
      </button>
    }
  </div>

  <!-- Grid -->
  <div class="proj-grid">
    @for (proj of filtered; track proj.id) {
      <article class="proj-card pixel-box" [class.featured]="proj.featured">

        <!-- Card top bar -->
        <div class="card-topbar">
          <div class="topbar-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <span class="card-file">project_{{ proj.id }}.ts</span>
          <span class="status-chip" [style.color]="getStatusColor(proj.status)">
            {{ proj.status }}
          </span>
        </div>

        @if (proj.featured) {
          <div class="featured-row">
            <span class="featured-badge">★ DESTACADO</span>
          </div>
        }

        <!-- Body -->
        <div class="card-body">
          <h3 class="proj-title">{{ proj.title }}</h3>
          <p class="proj-desc">{{ proj.desc }}</p>
          <div class="proj-tags">
            @for (t of proj.tags; track t) {
              <span class="tag">{{ t }}</span>
            }
          </div>
        </div>

        <!-- Links -->
        <div class="card-links">
          @if (proj.url) {
            <a [href]="proj.url" target="_blank" class="link-btn">▶ DEMO</a>
          }
          @if (proj.repo) {
            <a [href]="proj.repo" target="_blank" class="link-btn outline">⌥ CÓDIGO</a>
          }
        </div>

      </article>
    }
  </div>
</section>
