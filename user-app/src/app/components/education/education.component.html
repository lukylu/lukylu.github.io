<section id="education" class="education noise">
  <app-section-title label="ESTUDIOS" num="03" />

  <div class="edu-list">
    <div class="edu-card pixel-box" *ngFor="let item of items; let i = index"
         [class.current]="item.current">

      <div class="card-header">
        <div class="card-index">{{ i + 1 | number:'2.0-0' }}</div>
        <div class="card-meta">
          <span class="card-period">{{ item.period }}</span>
          <span class="current-badge" *ngIf="item.current">
            <span class="blink">●</span> EN CURSO
          </span>
        </div>
      </div>

      <h3 class="card-degree">{{ item.degree }}</h3>
      <p class="card-school">
        <span class="prompt">@</span> {{ item.school }}
      </p>

      <div class="card-tags">
        <span class="tag" *ngFor="let t of item.tags">{{ t }}</span>
      </div>

      <div class="card-grade" *ngIf="item.grade">
        <span class="grade-label">NOTA:</span>
        <span class="grade-value">{{ item.grade }}</span>
      </div>
    </div>
  </div>
</section>
