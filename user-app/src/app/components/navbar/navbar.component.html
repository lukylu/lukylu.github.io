<nav class="navbar" [class.scrolled]="isScrolled">

  <div class="navbar-logo" (click)="scrollTo('hero')">
    <span class="logo-prompt">C:\&gt;</span>
    <span class="logo-name">LUCAS_FI</span>
    <span class="logo-cursor blink">_</span>
  </div>

  <!-- Desktop links -->
  <ul class="navbar-links">
    @for (item of navItems; track item.target) {
      <li>
        <button
          class="nav-btn"
          [class.active]="activeSection === item.target"
          (click)="scrollTo(item.target)">
          {{ item.label }}
        </button>
      </li>
    }
  </ul>

  <!-- Hamburger (solo móvil) -->
  <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

  <!-- Mobile menu desplegable -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul>
      @for (item of navItems; track item.target) {
        <li>
          <button class="mobile-nav-btn" (click)="scrollTo(item.target)">
            {{ item.label }}
          </button>
        </li>
      }
    </ul>
  </div>

</nav>
