<section id="languages" class="languages noise">
  <app-section-title label="IDIOMAS" num="05" />

  <div class="lang-grid">
    @for (lang of langs; track lang.name) {
      <div class="lang-card pixel-box">
        <div class="lang-header">
          <span class="lang-flag">{{ lang.flag }}</span>
          <div>
            <h3 class="lang-name">{{ lang.name }}</h3>
            <span class="lang-level" [style.color]="getLevelColor(lang.pct)">
              {{ lang.level }}
            </span>
          </div>
          @if (lang.cert) {
            <span class="lang-cert">{{ lang.cert }}</span>
          }
        </div>
        <div class="lang-blocks">
          @for (filled of getBlocks(lang.pct); track $index) {
            <div
              class="block"
              [class.filled]="filled"
              [style.background]="filled ? getLevelColor(lang.pct) : 'transparent'"
              [style.box-shadow]="filled ? '0 0 4px ' + getLevelColor(lang.pct) : 'none'">
            </div>
          }
        </div>
        <span class="lang-pct">{{ lang.pct }}%</span>
      </div>
    }
  </div>
</section>
